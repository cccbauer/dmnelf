project:
  name: eeg_bold_coupling_dmnelf
  base_dir: /projects/swglab/data/DMNELF/analysis/fingerprint/eeg_bold_coupling

data:
  # CLUSTER paths (used without --offline)
  eeg_preproc_dir_cluster: /projects/swglab/data/DMNELF/derivatives/eeg_preprocessed
  features_dir_cluster: /projects/swglab/data/DMNELF/derivatives/cyclic_features

  # OFFLINE paths (used with --offline flag)
  eeg_preproc_dir_local: ~/Documents/GitHub/dmnelf/data/DMNELF/derivatives/eeg_preprocessed
  features_dir_local: ~/Documents/GitHub/dmnelf/data/DMNELF/derivatives/cyclic_features

  # Confounds (fMRIPrep) — needed for global_signal regression
  confounds_dir_cluster: /projects/swglab/data/DMNELF/derivatives/fmriprep_25.2.5_fmap
  confounds_dir_local: ~/Documents/GitHub/dmnelf/data/DMNELF/derivatives/fmriprep_25.2.5_fmap

  session: ses-dmnelf
  task: feedback

  subjects:
    all: [dmnelf001, dmnelf004, dmnelf005, dmnelf006, dmnelf007, dmnelf008,
          dmnelf009, dmnelf010, dmnelf011, dmnelf012, dmnelf013, dmnelf014,
          dmnelf015, dmnelf1001, dmnelf1002, dmnelf1003]
    validation: [dmnelf016]
    exclude: []

  fmri:
    tr: 1.2
    dmn_idx: 64
    cen_idx: 65
    n_difumo: 64

  eeg:
    sfreq: 500.0
    samples_per_tr: 600
    desc: preproc500Hz
    occipital: [O1, O2, Oz, POz, PO3, PO4]

bands:
  delta: [1, 4]
  theta: [4, 8]
  alpha: [8, 13]
  beta:  [13, 30]
  gamma: [30, 40]

hrf:
  length_s: 32
  delay: 6
  undershoot: 16

stats:
  nperm: 2000
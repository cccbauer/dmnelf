project:
  name: eeg_bold_coupling_rtbpd_nf2
  description: 'rtBPD FIRST neurofeedback session (nf1) config for the band-power
    decoder cross-cohort external validation. EEG in ses-nf, fMRI/confounds in ses-nf1
    (same physical session); cyclic_features filenames carry no session label.

    '
data:
  eeg_preproc_dir_cluster: /projects/swglab/data/rtBPD/derivatives/eeg_preprocessed
  features_dir_cluster: /projects/swglab/data/rtBPD/derivatives/cyclic_features_nf2
  confounds_dir_cluster: /projects/swglab/data/rtBPD/derivatives/fmriprep_25.2.5_fmap
  eeg_preproc_dir_local: ~/Documents/GitHub/dmnelf/data/rtBPD/derivatives/eeg_preprocessed
  features_dir_local: ~/Documents/GitHub/dmnelf/data/rtBPD/derivatives/cyclic_features_nf2
  confounds_dir_local: ~/Documents/GitHub/dmnelf/data/rtBPD/derivatives/fmriprep_25.2.5_fmap
  session: ses-nf2
  session_eeg: ses-nf2
  session_fmri: ses-nf2
  task: feedback
  subjects:
    all:
    - rtbpd002
    - rtbpd003
    - rtbpd009
    - rtbpd010
    - rtbpd011
    - rtbpd015
    - rtbpd018
    - rtbpd022
    - rtbpd026
    - rtbpd027
    - rtbpd028
    - rtbpd030
    exclude: []
  fmri:
    tr: 1.2
    dmn_idx: 64
    cen_idx: 65
    n_difumo: 64
  eeg:
    sfreq: 500.0
    samples_per_tr: 600
    desc: preproc500Hz
    occipital:
    - O1
    - O2
    - Oz
    - POz
    - PO3
    - PO4
bands:
  delta:
  - 1
  - 4
  theta:
  - 4
  - 8
  alpha:
  - 8
  - 13
  beta:
  - 13
  - 30
  gamma:
  - 30
  - 40
hrf:
  length_s: 32
  delay: 6
  undershoot: 16
stats:
  nperm: 2000

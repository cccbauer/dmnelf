# Copy to credentials.yaml and fill in.  credentials.yaml is git-ignored — never commit secrets.
#
# Get a client_id / client_secret from the Emotiv developer portal:
#   https://www.emotiv.com/developer  ->  "My Apps"  ->  create an app.
# Raw EEG is license-gated: your app needs raw-EEG scope (EmotivPRO subscription or a
# raw-data license). On first connect, APPROVE this app in the Emotiv Launcher.

client_id: "YOUR_CORTEX_CLIENT_ID"
client_secret: "YOUR_CORTEX_CLIENT_SECRET"
license_id: null        # optional: a specific license id; null uses your default entitlement
headset_id: null        # optional: e.g. "EPOCX-XXXXXXXX"; null = first headset found
